# ~90M hetero (multipole-isolation ablation) rung — large_walrus shape (h768/7blk/8h) with the
# heterogeneous space-mixing block but NO multipole: 5 local + 3 full (K=3), matching
# large_walrus_hetero_multipole's K so the only difference is the 2 multipole heads.
# flat (large_walrus) -> this = reach-restriction at scale;  this -> multipole = multipole's
# marginal value at scale. Warm-startable from large_walrus (param-identical, strict load OK).
defaults:
  - encoder: spacebag_and_vstride_encoder
  - decoder: vstride_decoder
  - processor: space_time_split
  - norm_layer: rmsgroupnorm
_target_: walrus.models.IsotropicModel
hidden_dim: 768
projection_dim: 96
intermediate_dim: 192
processor_blocks: 7
drop_path: 0.05
groups: 12
max_d: 3
causal_in_time: False
include_d: [2, 3]
override_dimensionality: 3
jitter_patches: True
gradient_checkpointing_freq: 0
input_field_drop: 0.0
processor:
  space_mixing:
    _partial_: true
    _target_: walrus.models.spatial_blocks.heterogeneous_attention.HeterogeneousAttention
    num_heads: 8
    n_local: 5
    n_strided: 0
    n_multipole: 0
    n_full: 3
    local_radius: 1
    strided_strides: []
  time_mixing:
    _partial_: true
    _target_: walrus.models.temporal_blocks.axial_time_attention.AxialTimeAttention
    num_heads: 8
  _partial_: true
  _target_: walrus.models.spatiotemporal_blocks.space_time_split.SpaceTimeSplitBlock
