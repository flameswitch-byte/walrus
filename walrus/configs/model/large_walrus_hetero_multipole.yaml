# ~90M hetero (multipole) rung — large_walrus shape (h768/7blk/8h, groups 12, intermediate 192)
# with the heterogeneous space-mixing block. Matched to large_walrus (the flat baseline) and to
# medium_walrus_hetero_multipole's head allocation (3 local + 2 multipole + 3 full, K=3) so the
# medium->large comparison is a clean scaling slope. Warm-startable from large_walrus (strict=False;
# the multipole projections init fresh). See walrus_attention_design.md §13 / §15.
defaults:
  - encoder: spacebag_and_vstride_encoder
  - decoder: vstride_decoder
  - processor: space_time_split
  - norm_layer: rmsgroupnorm
_target_: walrus.models.IsotropicModel
hidden_dim: 768
projection_dim: 96
intermediate_dim: 192
processor_blocks: 7
drop_path: 0.05
groups: 12
max_d: 3
causal_in_time: False
include_d: [2, 3]
override_dimensionality: 3
jitter_patches: True
gradient_checkpointing_freq: 0
input_field_drop: 0.0
processor:
  space_mixing:
    _partial_: true
    _target_: walrus.models.spatial_blocks.heterogeneous_attention.HeterogeneousAttention
    num_heads: 8
    n_local: 3
    n_strided: 0
    n_multipole: 2
    n_full: 3
    local_radius: 1
    strided_strides: []
    multipole_pool: [2, 3, 4]
    multipole_eval_pool: 3
    multipole_order: 2
  time_mixing:
    _partial_: true
    _target_: walrus.models.temporal_blocks.axial_time_attention.AxialTimeAttention
    num_heads: 8
  _partial_: true
  _target_: walrus.models.spatiotemporal_blocks.space_time_split.SpaceTimeSplitBlock
