defaults:
  - encoder: spacebag_and_vstride_encoder
  - decoder: vstride_decoder
  - processor: space_time_split
  - norm_layer: rmsgroupnorm
_target_: walrus.models.IsotropicModel
hidden_dim: 256
projection_dim: 96
intermediate_dim: 96
processor_blocks: 6
drop_path: 0.05
groups: 8
max_d: 3
causal_in_time: False
include_d: [2, 3]
override_dimensionality: 3
jitter_patches: True
gradient_checkpointing_freq: 0
input_field_drop: 0.0
processor:
  space_mixing:
    _partial_: true
    _target_: walrus.models.spatial_blocks.fmm_attention.FMMAttention
    num_heads: 8
    near_radius: 3
    pool_base: 2
    far_inner: 2
    far_outer: 3
    learned_pool: true
    tie_levels: false
    global_mop_up: false   # true restores FULL global reach (Poisson: fmm 0.30 -> 0.178 ≈ full 0.177);
                           # recommended for true-3D / small grids where few annulus levels fit.
                           # Off by default = pure interaction-list (no near/far overlap).
    max_token_grid: 64     # medium uses 32 (2D) / 16 (3D); 64 covers the highres lever too
  time_mixing:
    _partial_: true
    _target_: walrus.models.temporal_blocks.axial_time_attention.AxialTimeAttention
    num_heads: 8
  _partial_: true
  _target_: walrus.models.spatiotemporal_blocks.space_time_split.SpaceTimeSplitBlock
