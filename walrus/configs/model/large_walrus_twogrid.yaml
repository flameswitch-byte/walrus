# ~90M two-grid NON-high-res ([8,4] kernel @32 tokens, global coarse) at the DEFAULT-walrus
# proportions (intermediate 192, groups 12) -- the large-scale analog of
# medium_walrus_twogrid, and the [8,4]@32 reference for the resolution/kernel comparisons.
# Iso-param (~within 2%) to large_walrus (89.9M flat @32) and large_walrus_twogrid_highres
# (91.4M [4,4]@64), completing the ~90M set: flat@32 / two-grid@32 / two-grid@64.
# Tuned to ~90M via block count (two-grid's heavier processor -> fewer blocks than flat's 7).
defaults:
  - encoder: twogrid_vstride_encoder
  - decoder: vstride_decoder
  - processor: space_time_split
  - norm_layer: rmsgroupnorm
_target_: walrus.models.IsotropicModel
hidden_dim: 744              # matches large_walrus_twogrid_highres width; head_dim 93, /12=62
projection_dim: 96
intermediate_dim: 192
processor_blocks: 4          # [8,4] enc/dec is heavy -> 4 blocks lands ~92.5M (~90M set)
drop_path: 0.05
groups: 12
max_d: 3
causal_in_time: False
include_d: [2, 3]
override_dimensionality: 3
jitter_patches: True
gradient_checkpointing_freq: 0
input_field_drop: 0.0
per_axis_tokens:   # null -> default 32/axis 2D ([8,4] reaches 32 on all the_well 2D axes)
processor:
  space_mixing:
    _partial_: true
    _target_: walrus.models.spatial_blocks.cross_scale_attention_twogrid.TwoGridCrossScaleAttention
    num_heads: 8
    fine_window: 3
    coarse_window: global        # coarse self-attn global (carries global reach)
    prolong_window: 3            # fine reads parent's 3^d coarse nbhd (interp, no seams)
    coarse_coupling: bidirectional
  time_mixing:
    _partial_: true
    _target_: walrus.models.temporal_blocks.axial_time_attention.AxialTimeAttention
    num_heads: 8
  _partial_: true
  _target_: walrus.models.spatiotemporal_blocks.space_time_split.SpaceTimeSplitBlock
