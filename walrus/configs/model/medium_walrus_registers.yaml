defaults:
  - encoder: spacebag_and_vstride_encoder
  - decoder: vstride_decoder
  - processor: space_time_split
  - norm_layer: rmsgroupnorm
_target_: walrus.models.IsotropicModel
hidden_dim: 256
projection_dim: 96
intermediate_dim: 96
processor_blocks: 6
drop_path: 0.05
groups: 8
max_d: 3
causal_in_time: False
include_d: [2, 3]
override_dimensionality: 3
jitter_patches: True
gradient_checkpointing_freq: 0
input_field_drop: 0.0
# Persistent global register tokens (flat FullAttention + K learned global slots). 0 = off
# = byte-identical to medium_walrus. Only new params: K x hidden_dim (8 x 256 = 2048).
# A handful is plenty: registers hold GLOBAL summary state (conserved/regime/phase), not the
# field itself (full attention still processes the whole grid). DINOv2 uses 4; 4-8 typical.
# Must be 0 or >= 2 (K=1 is degenerate). Sweepable knob.
num_register_tokens: 8
processor:
  space_mixing:
    _partial_: true
    _target_: walrus.models.spatial_blocks.register_attention.RegisterAttention
    num_heads: 8
  time_mixing:
    _partial_: true
    _target_: walrus.models.temporal_blocks.axial_time_attention.AxialTimeAttention
    num_heads: 8
  _partial_: true
  _target_: walrus.models.spatiotemporal_blocks.space_time_split.SpaceTimeSplitBlock
